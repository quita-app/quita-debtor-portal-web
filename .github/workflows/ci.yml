name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: http://localhost:8080 # o build exige a variável; nada chama a API no build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit # erro de tipo falha o PR
      - run: npm test -- --run # Vitest, uma passada (sem modo observação)
      - run: npm run build
